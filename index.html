<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Enter The Vibe</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: black;
  color: white;
  text-align: center;
}

/* ENTER BUTTON */
#launcher {
  margin-top: 100px;
}

#launcher button {
  padding: 20px 50px;
  font-size: 20px;
  background: black;
  color: white;
  border: 2px solid white;
  cursor: pointer;
}

/* FULLSCREEN ROOM */
#room {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  z-index: 999;
}

/* GAME FRAME */
#gameFrame {
  width: 100%;
  height: 100%;
  border: none;
}

/* CONTROLS */
#controls {
  position: absolute;
  bottom: 20px;
  left: 20px;
  text-align: left;
}

#controls button {
  margin: 5px;
  padding: 10px 15px;
}

#info {
  margin-top: 10px;
  font-size: 14px;
  opacity: 0.8;
}

/* EXIT */
#exitBtn {
  position: absolute;
  top: 20px;
  right: 20px;
  padding: 10px 15px;
}
</style>
</head>

<body>

<!-- ENTER SCREEN -->
<div id="launcher">
  <button onclick="enterRoom()">ENTER THE VIBE</button>
</div>

<!-- ROOM -->
<div id="room">

  <iframe 
    id="gameFrame"
    src="https://TPrice0221.github.io/PBPAudio/"
    allow="autoplay">
  </iframe>

  <button id="exitBtn" onclick="exitRoom()">EXIT</button>

  <div id="controls">
    <button onclick="toggleAudio()">Play / Pause</button>
    <button onclick="restartAudio()">Restart</button>

    <div id="info">
      Beat: "XoXo"<br>
      Producer: CannaprizeBEATS
    </div>
  </div>

</div>

<!-- AUDIO (THIS is the important part) -->
<audio id="roomAudio" src="beat.mp3"></audio>

<script>
let audio = document.getElementById("roomAudio");

function enterRoom() {
  document.getElementById("room").style.display = "block";

  audio.currentTime = 0;
  audio.play();
}

function exitRoom() {
  document.getElementById("room").style.display = "none";

  audio.pause();
  audio.currentTime = 0;

  // reset iframe (stops game)
  let frame = document.getElementById("gameFrame");
  frame.src = frame.src;
}

function toggleAudio() {
  if (audio.paused) {
    audio.play();
  } else {
    audio.pause();
  }
}

function restartAudio() {
  audio.currentTime = 0;
  audio.play();
}
</script>

</body>
</html>
