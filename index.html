<!DOCTYPE html>
<html>
<head>
  <title>PBP Audio Experience</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
#vibeLauncher {
  text-align: center;
  margin: 40px 0;
}

#vibeLauncher button {
  padding: 18px 40px;
  font-size: 18px;
  background: black;
  color: white;
  border: 2px solid white;
  cursor: pointer;
}

#vibeContainer {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  z-index: 999;
}

#vibeFrame {
  width: 100%;
  height: 100%;
}

#closeBtn {
  position: absolute;
  top: 20px;
  right: 20px;
  padding: 10px 15px;
  z-index: 1000;
}
    /* Overlay screen */
    #overlay {
      position: fixed;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, #111, #000);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 24px;
      letter-spacing: 2px;
      cursor: pointer;
      z-index: 10;
    }

    #overlay span {
      opacity: 0.8;
      transition: 0.3s;
    }

    #overlay:hover span {
      opacity: 1;
      transform: scale(1.05);
    }

    /* Optional subtle background pulse */
    .pulse {
      position: fixed;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(255,255,255,0.05), transparent);
      animation: pulse 2s infinite;
      z-index: 1;
    }

    @keyframes pulse {
      0% { opacity: 0.2; }
      50% { opacity: 0.5; }
      100% { opacity: 0.2; }
    }
  </style>
</head>

<body>

  <div id="overlay">
    <span>ENTER THE VIBE</span>
  </div>

  <div class="pulse"></div>

  <audio id="bgMusic" loop>
    <source src="yourbeat.mp3" type="audio/mpeg">
  </audio>
  <script>
function openVibe() {
  document.getElementById("vibeContainer").style.display = "block";
}

function closeVibe() {
  document.getElementById("vibeContainer").style.display = "none";

  // reload iframe to stop music
  let frame = document.getElementById("vibeFrame");
  frame.src = frame.src;
}
</script>

  <script>
    const overlay = document.getElementById("overlay");
    const audio = document.getElementById("bgMusic");

    overlay.addEventListener("click", () => {
      audio.volume = 0;
audio.play();

let vol = 0;
let fade = setInterval(() => {
  if (vol < 0.8) {
    vol += 0.05;
    audio.volume = vol;
  } else {
    clearInterval(fade);
  }
}, 200);
      overlay.style.display = "none";
    });
  </script>

</body>
</html>
